  for(let l=0;l<5;l++){const y=215+l*128;s+=`<rect x="${x}" y="${y}" width="242" height="9" fill="#e0a030" opacity=".75"/>`;
   for(let bx=x+14;bx<x+212;){const w=32+rnd()*34,h=40+rnd()*62;s+=`<rect x="${bx}" y="${y-h}" width="${w}" height="${h}" rx="3" fill="hsl(${26+rnd()*20},58%,${40+rnd()*20}%)" opacity=".88"/><rect x="${bx}" y="${y-h*.55}" width="${w}" height="4" fill="#fff" opacity=".18"/>`;bx+=w+6}}}
 return s+'</svg>'}

const mainWh=()=>(db.warehouses.find(w=>w.main)||db.warehouses[0]||{}).id,
 whName=w=>w?(w.name||(w.main?L("المستودع الرئيسي|Main warehouse"):"—")):"—",
 whq=(p,w)=>(p.wh&&p.wh[w])||0;
function mv(p,w,d,tot=1){p.wh=p.wh||{};p.wh[w]=(p.wh[w]||0)+d;if(tot)p.stock+=d}
function setStock(p,nq,w){const d=nq-p.stock;if(d>=0){mv(p,w,d);return}let r=-d;[w,...db.warehouses.map(x=>x.id).filter(x=>x!=w)].forEach(x=>{const t=Math.min(r,whq(p,x));if(t>0){mv(p,x,-t);r-=t}})}
